<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRMS | Crime Record Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <!-- Brand -->
            <div class="brand">
                 <img
                     src="assets/crms-logo.png"
                     alt="CRMS - Crime Record Management System"
                    class="crms-logo"
            >
            </div>


            <!-- Login Card -->
            <div class="login-card">

                <div class="login-heading">
                    <h2>Welcome back</h2>

                    <p>
                        Sign in to access the crime records portal.
                    </p>
                </div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Sign In
                    </button>

                </form>


                <div class="login-note">
                    Authorized personnel only
                </div>

            </div>


            <div class="footer-text">
                Crime Record Management System · 2026
            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>
</html>
