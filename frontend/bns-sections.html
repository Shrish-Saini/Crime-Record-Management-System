<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CRMS | BNS Sections</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="bns-page">

<div class="app-layout">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

    <div class="sidebar-brand">
        <img src="assets/crms-logo.png" alt="CRMS" class="sidebar-logo">
    </div>

    <nav class="navigation">

        <a href="cases.html" class="nav-link">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 5h16"></path>
                    <path d="M4 9h16"></path>
                    <path d="M4 13h16"></path>
                    <path d="M4 17h10"></path>
                </svg>
            </span>
            <span>Cases</span>
        </a>

        <a href="investigations.html" class="nav-link">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="6"></circle>
                    <path d="m16 16 4 4"></path>
                </svg>
            </span>
            <span>Investigations</span>
        </a>

        <a href="evidence.html" class="nav-link">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 3h12v18H6z"></path>
                    <path d="M9 7h6"></path>
                    <path d="M9 11h6"></path>
                    <path d="M9 15h4"></path>
                </svg>
            </span>
            <span>Evidence</span>
        </a>

        <a href="courts.html" class="nav-link">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 4v16"></path>
                    <path d="M5 7h14"></path>
                    <path d="M7 7 4 13h6L7 7z"></path>
                    <path d="M17 7l-3 6h6l-3-6z"></path>
                    <path d="M8 20h8"></path>
                </svg>
            </span>
            <span>Courts</span>
        </a>

        <a href="bns-sections.html" class="nav-link active">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 3h9l4 4v14H6z"></path>
                    <path d="M15 3v5h5"></path>
                    <path d="M9 12h6"></path>
                    <path d="M9 16h6"></path>
                </svg>
            </span>
            <span>BNS Sections</span>
        </a>

        <a href="reports.html" class="nav-link">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 20V10"></path>
                    <path d="M12 20V4"></path>
                    <path d="M19 20v-7"></path>
                    <path d="M3 20h18"></path>
                </svg>
            </span>
            <span>Reports</span>
        </a>

    </nav>

    <div class="sidebar-bottom">

        <a href="#" class="nav-link"></a>

        <a href="index.html" class="nav-link logout">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 5H5v14h5"></path>
                    <path d="M14 8l4 4-4 4"></path>
                    <path d="M18 12H9"></path>
                </svg>
            </span>
            <span>Logout</span>
        </a>

    </div>

</aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <header class="page-header">

            <div>

                <h1>BNS Sections</h1>

                <p>
                    Browse the Bharatiya Nyaya Sanhita section records.
                </p>

            </div>

        </header>


        <!-- ================= SEARCH ================= -->

        <section class="filter-card">

            <div class="search-box">

                <span class="search-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m16 16 5 5"></path>
                    </svg>
                </span>

                <input
                    type="text"
                    id="bnsSearch"
                    placeholder="Search section number, title, chapter or description..."
                    autocomplete="off">

            </div>

        </section>


        <!-- ================= BNS TABLE ================= -->

        <section class="content-card">

            <div class="card-header">

                <div>

                    <h2>All BNS Sections</h2>

                    <p>
                        Bharatiya Nyaya Sanhita section records
                    </p>

                </div>

                <span id="bnsCount"
                      class="record-count">
                    0 Sections
                </span>

            </div>


            <div class="table-wrapper">

                <table class="cases-table bns-table">

                    <thead>

                        <tr>

                            <th>Section</th>

                            <th>Title</th>

                            <th>Chapter</th>

                            <th>Chapter Subtype</th>

                            <th>Description</th>

                        </tr>

                    </thead>


                    <tbody id="bnsTableBody">

                        <tr>

                            <td colspan="5"
                                style="text-align:center; padding:30px;">

                                Loading BNS sections...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<script src="js/auth.js"></script>
<script src="js/bns-sections.js"></script>

</body>

</html>
