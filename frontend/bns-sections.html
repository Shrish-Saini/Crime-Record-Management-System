    <main class="main-content">

        <header class="page-header">

            <div>

                <h1>BNS Sections</h1>

                <p>
                    Browse the Bharatiya Nyaya Sanhita section records.
                </p>

            </div>

        </header>


        <!-- ================= SEARCH ================= -->

        <section class="filter-card">

            <div class="search-box">

                <span class="search-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m16 16 5 5"></path>
                    </svg>
                </span>

                <input
                    type="text"
                    id="bnsSearch"
                    placeholder="Search section number, title, chapter or description..."
                    autocomplete="off">

            </div>

        </section>


        <!-- ================= BNS TABLE ================= -->

        <section class="content-card">

            <div class="card-header">

                <div>

                    <h2>All BNS Sections</h2>

                    <p>
                        Bharatiya Nyaya Sanhita section records
                    </p>

                </div>

                <span id="bnsCount"
                      class="record-count">
                    0 Sections
                </span>

            </div>


            <div class="table-wrapper">

                <table class="cases-table bns-table">

                    <thead>

                        <tr>

                            <th>Section</th>

                            <th>Title</th>

                            <th>Chapter</th>

                            <th>Chapter Subtype</th>

                            <th>Description</th>

                        </tr>

                    </thead>


                    <tbody id="bnsTableBody">

                        <tr>

                            <td colspan="5"
                                style="text-align:center; padding:30px;">

                                Loading BNS sections...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>
